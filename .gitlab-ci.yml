# .gitlab-ci.yml
image: mcr.microsoft.com/playwright:v1.58.2-jammy # Use matching playwright version

  
stages:
  - test
# ── Global pipeline variables (override in GitLab CI/CD Settings → Variables
#    or via UI when running pipeline manually) ──────────────────────
variables:
  BASE_URL:
    value: "https://dashboard-dev.freewillgroup.com/"
    description: "The base URL of the environment to test"
  TEST_DATA_DIR:
    value: "data/prprocess"
    options:
      - "data/prprocess"
      - "data/vib_dashboard"
      - "data/ua"
      - "data/ardee"
      - "data/ezwow"
    description: "Project folder in data directory"

# Default settings for all jobs
default:
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
    policy: pull-push

# Job: Run Tests (project ถูกเลือกด้วย TEST_DATA_DIR ที่รับมาจาก trigger)
test:
  tags: 
    - docker
  stage: test
  script:
    - npm ci
    - npm test || true
  artifacts:
    when: always
    paths:
      - test-results/
    expire_in: 2 hours
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"' # triggered จาก project อื่น (ส่ง TEST_DATA_DIR มาเอง)
    - if: '$CI_PIPELINE_SOURCE == "web"'       # Manual run จาก GitLab UI
      when: manual
    - changes:                                 # push ที่มีการเปลี่ยนแปลง test/data
        - test/**/*
        - data/**/*

